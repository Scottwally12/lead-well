:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color:#193332;background:#f5f7f5}*{box-sizing:border-box}body{margin:0}header{background:#163c3a;color:white;padding:22px 20px 18px}header h1{font-size:26px;margin:0}header p{opacity:.85;margin:6px 0 0;font-size:13px}.wrap{max-width:780px;margin:auto;padding:18px 16px 100px}.tabs{display:flex;gap:6px;overflow-x:auto;margin:0 0 16px}.tabs button{white-space:nowrap;border:0;background:#e4ece8;color:#21463e;border-radius:22px;padding:11px 15px;font-weight:650}.tabs button.active{background:#163c3a;color:white}.card{background:white;border:1px solid #dce5df;border-radius:17px;padding:17px;margin-bottom:13px;box-shadow:0 2px 7px #1232}.card h2{font-size:19px;margin:0 0 9px}.card h3{font-size:16px;margin:0 0 8px}.muted{color:#647772;font-size:13px}.item{display:flex;gap:10px;align-items:flex-start;padding:11px 0;border-bottom:1px solid #edf1ee}.item:last-child{border:0}.item input[type=checkbox]{width:20px;height:20px;accent-color:#226d58;margin-top:2px}.item label{flex:1;line-height:1.35}.done{text-decoration:line-through;color:#7e9088}button,.btn{cursor:pointer;font:inherit}.primary{background:#226d58;color:white;border:0;border-radius:10px;padding:11px 15px;font-weight:650}.secondary{background:#e9f1ed;color:#21483c;border:0;border-radius:10px;padding:10px 13px}.danger{color:#a23b35;background:#fff0ee;border:0;border-radius:10px;padding:9px 12px}.small{font-size:12px;padding:7px 10px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}input,select,textarea{font:inherit;width:100%;border:1px solid #bfcfc6;border-radius:9px;padding:10px;background:white;color:#163c3a}textarea{min-height:75px}label.field{display:block;font-weight:650;font-size:13px;margin:12px 0 5px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.pill{font-size:11px;background:#e9f1ed;color:#205642;border-radius:20px;padding:5px 9px;display:inline-block}.event{display:flex;align-items:center;justify-content:s
